<!DOCTYPE html>
<html lang="en">
<head>
    <title>Gesture Recognition</title>
    <script src="https://cdn.socket.io/4.5.4/socket.io.min.js"></script>
    <style>
        video {
            transform: scaleX(-1); /* Mirror the video horizontally */
        }
    </style>
</head>
<body>
    <h1>Gesture Controlled Web App</h1>
    <video id="video" autoplay></video>
    <canvas id="canvas"></canvas>
    <h2 id="gesture">Gesture: None</h2>

    <script>
        const socket = io("http://localhost:5000");
        const video = document.getElementById("video");
        const canvas = document.getElementById("canvas");
        const ctx = canvas.getContext("2d");

        let processingFrame = false; // Prevent multiple frames from processing

        navigator.mediaDevices.getUserMedia({ video: true }).then(stream => {
            video.srcObject = stream;
            video.addEventListener("loadeddata", sendFrame); // Start sending frames when video loads
        });

        function sendFrame() {
            if (processingFrame) return; // Skip if already processing

            processingFrame = true;
            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;
            
            // Flip the frame horizontally before sending
            ctx.save();
            ctx.translate(canvas.width, 0); // Move origin to right
            ctx.scale(-1, 1); // Flip horizontally
            ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
            ctx.restore(); // Restore context to avoid issues
            
            const dataUrl = canvas.toDataURL("image/png");
            socket.emit("image", dataUrl);
        }

        // Receive recognized gesture
        socket.on("gesture", data => {
            console.log("🟢 Received Gesture:", data);
            document.getElementById("gesture").innerText = `Gesture: ${data.gesture}`;
            processingFrame = false; // Allow next frame to be sent
            setTimeout(sendFrame, 100); // Add a small delay before sending the next frame
        });

    </script>
</body>
</html>
